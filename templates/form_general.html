{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    /* Bọc form ở giữa màn hình */
    .form-wrapper { max-width: 900px; margin: 40px auto; padding: 0 15px; }
    
    /* Khung tìm kiếm Custom nổi bật */
    .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-box input { 
        flex: 1; padding: 12px 15px; border: 2px solid #e2e8f0; 
        border-radius: 10px; font-size: 14px; outline: none; transition: 0.3s; background: #ffffff; 
    }
    .search-box input:focus { 
        border-color: #fb6340; box-shadow: 0 0 0 4px rgba(251, 99, 64, 0.1); 
    }
    .search-box button { 
        background: linear-gradient(135deg, #fb6340 0%, #f5365c 100%); color: white; 
        border: none; padding: 0 25px; border-radius: 10px; font-weight: 600; 
        cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(245, 54, 92, 0.3); 
    }
    .search-box button:hover { 
        transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245, 54, 92, 0.4); 
    }
    
    /* Nhãn dán (Label) hiện đại */
    .form-label { 
        display: block; font-weight: 600; color: #525f7f; margin-bottom: 8px; 
        font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; 
    }
    
    /* Nút Quay lại */
    .btn-back { 
        background: #f1f5f9; color: #475569; padding: 12px 25px; border-radius: 10px; 
        text-decoration: none; font-weight: 600; margin-right: 15px; transition: 0.3s; display: inline-block; 
    }
    .btn-back:hover { background: #e2e8f0; color: #1e293b; }
</style>

<div class="form-wrapper">
    <div class="card-box">
        <h2 style="color: #2c3e50; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; font-weight: 600;">
            <i class="fa-solid fa-pen-to-square" style="color: #5e72e4;"></i> {{ title }}
        </h2>

        <form method="post">
            {% csrf_token %}
            
            <div style="background: #fff5f5; padding: 20px; border-radius: 12px; border: 1px dashed #fb6340; margin-bottom: 30px;">
                <label class="form-label" style="color: #d83b01;"><i class="fa-solid fa-map-location-dot"></i> Tìm kiếm & Chọn Tọa Độ Trên Bản Đồ</label>
                
                <div class="search-box">
                    <input type="text" id="address-search" placeholder="Nhập địa chỉ cần tìm (VD: Landmark 81, Hồ Chí Minh)...">
                    <button type="button" id="btn-search"><i class="fa-solid fa-magnifying-glass"></i> Tìm nhanh</button>
                </div>

                <div id="map-picker" style="height: 350px; width: 100%; border-radius: 10px; border: 1px solid #e2e8f0; z-index: 1;"></div>
                <small style="color: #8898aa; font-style: italic; margin-top: 10px; display: block;">
                    <i class="fa-solid fa-circle-info"></i> Kéo thả ghim màu xanh trên bản đồ để chọn vị trí chính xác nhất.
                </small>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                {% for field in form %}
                    <div style="margin-bottom: 5px; {% if field.name == 'lat' or field.name == 'lng' or field.name == 'lat_khach' or field.name == 'lng_khach' %}opacity: 0.6; pointer-events: none;{% endif %}">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <span style="color: #f5365c; font-size: 12px; margin-top: 5px; display: block;">
                                <i class="fa-solid fa-circle-exclamation"></i> {{ field.errors.0 }}
                            </span>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <div style="margin-top: 35px; text-align: right; border-top: 2px solid #f1f5f9; padding-top: 20px;">
                <a href="{% url back_url %}" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> LƯU DỮ LIỆU</button>
            </div>
        </form>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Dò tìm các ô input của Django Form
    const latInput = document.querySelector('input[name="lat"]') || document.querySelector('input[name="lat_khach"]');
    const lngInput = document.querySelector('input[name="lng"]') || document.querySelector('input[name="lng_khach"]');
    const addressInput = document.querySelector('input[name="dia_chi"]') || document.querySelector('input[name="dia_chi_nguoi_nhan"]');

    // 2. Lấy tọa độ mặc định (Mặc định ở trung tâm TP.HCM)
    let startLat = latInput && latInput.value ? parseFloat(latInput.value) : 10.7769;
    let startLng = lngInput && lngInput.value ? parseFloat(lngInput.value) : 106.7009;

    // 3. Khởi tạo bản đồ
    var map = L.map('map-picker').setView([startLat, startLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // 4. Khởi tạo Ghim (Marker) có thể kéo thả
    var marker = L.marker([startLat, startLng], {draggable: true}).addTo(map);

    // Hàm cập nhật tọa độ vào ô Input ẩn
    function updateInputs(lat, lng) {
        if(latInput) latInput.value = lat.toFixed(6);
        if(lngInput) lngInput.value = lng.toFixed(6);
    }

    // Khi người dùng kéo thả ghim xong -> cập nhật tọa độ
    marker.on('dragend', function (e) {
        var pos = marker.getLatLng();
        updateInputs(pos.lat, pos.lng);
    });

    // Bấm chuột lên bản đồ -> dời ghim tới đó
    map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        updateInputs(e.latlng.lat, e.latlng.lng);
    });

    // ==========================================
    // TÍNH NĂNG TÌM KIẾM ĐỊA CHỈ (GEOCODING)
    // ==========================================
    const btnSearch = document.getElementById('btn-search');
    const searchInput = document.getElementById('address-search');

    function executeSearch() {
        var query = searchInput.value;
        if(query.trim() === "") return;

        // Hiển thị trạng thái đang tìm
        var oldText = btnSearch.innerHTML;
        btnSearch.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tìm...';

        // Gọi API của OpenStreetMap để tìm địa chỉ (Miễn phí)
        fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query + ', Việt Nam'))
            .then(response => response.json())
            .then(data => {
                btnSearch.innerHTML = oldText; // Trả lại nút ban đầu
                
                if(data && data.length > 0) {
                    var lat = parseFloat(data[0].lat);
                    var lng = parseFloat(data[0].lon);

                    // Bay bản đồ tới vị trí mới và cắm ghim
                    map.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng]);
                    
                    // Điền tọa độ vào form
                    updateInputs(lat, lng);

                    // Tự động điền luôn tên đường vào ô "Địa Chỉ" nếu ô đó đang trống
                    if(addressInput && addressInput.value === "") {
                        addressInput.value = data[0].display_name.split(',')[0]; // Lấy phần tên ngắn
                    }
                } else {
                    alert("Không tìm thấy địa chỉ này! Thử gõ rõ hơn nhé (VD: Tên đường, Quận, TP.HCM)");
                }
            })
            .catch(error => {
                btnSearch.innerHTML = oldText;
                alert("Có lỗi xảy ra khi tìm kiếm.");
            });
    }

    // Kích hoạt tìm kiếm khi bấm nút hoặc ấn phím Enter
    btnSearch.addEventListener('click', executeSearch);
    searchInput.addEventListener('keypress', function(e) {
        if(e.key === 'Enter') {
            e.preventDefault(); // Tránh bị Submit nguyên cái Form
            executeSearch();
        }
    });
});
</script>
{% endblock %}
