{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    .main-content { background: #f0f2f5; min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; padding: 40px 0; }
    .glass-card { background: white; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); max-width: 850px; margin: auto; overflow: hidden; }
    .card-banner { background: linear-gradient(135deg, #5e72e4 0%, #825ee4 100%); padding: 40px; text-align: center; color: white; }
    .form-body { padding: 40px; }
    .input-label { font-size: 11px; font-weight: 800; color: #8898aa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
    .custom-input { border: 1px solid #e9ecef; border-radius: 12px; padding: 12px 15px; font-size: 14px; width: 100%; box-sizing: border-box; }
    
    /* KHU VỰC BẢN ĐỒ XỊN XÒ */
    .map-helper-section { border: 2px dashed #ff793f; border-radius: 24px; padding: 20px; margin-bottom: 30px; background: #fffaf8; position: relative; }
    
    .search-wrapper { position: relative; flex: 1; }
    .suggestion-box {
        position: absolute; top: 100%; left: 0; right: 0; background: white;
        border-radius: 12px; margin-top: 5px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        z-index: 1000; max-height: 200px; overflow-y: auto; display: none; list-style: none; padding: 0;
    }
    .suggestion-box li { padding: 10px 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 13px; color: #475569; }
    .suggestion-box li:hover { background: #fff5f5; color: #f5365c; }

    #map-picker { height: 350px; border-radius: 15px; z-index: 1; }

    /* THANH TỌA ĐỘ NẰM GỌN TRONG BẢN ĐỒ */
    .coord-overlay {
        position: absolute; bottom: 30px; left: 30px; right: 30px;
        background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px);
        padding: 10px 20px; border-radius: 12px; display: flex; gap: 20px;
        z-index: 1000; border: 1px solid rgba(0,0,0,0.05); justify-content: center;
    }
    .coord-item { font-size: 12px; color: #32325d; font-weight: 600; }
    .coord-item b { color: #5e72e4; margin-left: 5px; }

    .btn-gradient { background: linear-gradient(to right, #5e72e4, #825ee4); border: none; border-radius: 15px; color: white; padding: 15px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 20px; }
</style>

<div class="main-content">
    <div class="glass-card">
        <div class="card-banner">
            <h2><i class="fa-solid fa-cloud-arrow-up"></i> Cổng Đối Tác Gửi Hàng</h2>
            
        </div>

        <form method="POST" class="form-body">
            {% csrf_token %}
            
            <div class="map-helper-section">
                <label class="input-label" style="color: #ff793f;">Xác định vị trí trên bản đồ</label>
                
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <div class="search-wrapper">
                        <input type="text" id="address-search" class="custom-input" placeholder="Nhập địa chỉ cần tìm..." autocomplete="off">
                        <ul id="suggestion-list" class="suggestion-box"></ul>
                    </div>
                </div>

                <div id="map-picker"></div>

                <div class="coord-overlay">
                    <div class="coord-item">LAT: <b id="lat_text">10.776900</b></div>
                    <div class="coord-item">LNG: <b id="lng_text">106.700900</b></div>
                </div>

                <input type="hidden" name="lat_khach" id="lat_khach" value="10.7769">
                <input type="hidden" name="lng_khach" id="lng_khach" value="106.7009">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <label class="input-label">Tên người nhận</label>
                    <input type="text" name="ten_nguoi_nhan" class="custom-input" required>
                </div>
                <div>
                    <label class="input-label">Số điện thoại</label>
                    <input type="text" name="sdt_nguoi_nhan" class="custom-input" required>
                </div>
            </div>
             <div class="mb-4">
                <label class="input-label">Địa chỉ chi tiết</label>
                <textarea name="dia_chi_nguoi_nhan" id="dia_chi_input" class="custom-input" rows="2" required></textarea>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label class="input-label">Kho tiếp nhận</label>
                    <select name="kho_xuat_phat" class="custom-input" required>
                        {% for kho in ds_kho %}
                        <option value="{{ kho.id }}">{{ kho.ten_kho }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="input-label">Khối lượng (kg)</label>
                    <input type="number" name="khoi_luong" class="custom-input" step="0.1" value="1.0" required>
                </div>
            </div>

            <button type="submit" class="btn-gradient">XÁC NHẬN GỬI ĐƠN</button>
        </form>
    </div>
</div>

<script>
    // 1. Khởi tạo Map
    var map = L.map('map-picker').setView([10.7769, 106.7009], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var marker = L.marker([10.7769, 106.7009], { draggable: true }).addTo(map);

    function updateCoords(lat, lng) {
        document.getElementById('lat_khach').value = lat.toFixed(6);
        document.getElementById('lng_khach').value = lng.toFixed(6);
        document.getElementById('lat_text').innerText = lat.toFixed(6);
        document.getElementById('lng_text').innerText = lng.toFixed(6);
    }

    // 🚀 TÍNH NĂNG 1: Bấm vào bản đồ là ghim nhảy tới
    map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        updateCoords(e.latlng.lat, e.latlng.lng);
    });

    marker.on('dragend', function (e) {
        var coords = e.target.getLatLng();
        updateCoords(coords.lat, coords.lng);
    });

    // 🚀 TÍNH NĂNG 2: Gợi ý địa chỉ (Autocomplete)
    const searchInput = document.getElementById('address-search');
    const suggestionList = document.getElementById('suggestion-list');
    let timeoutId;

    searchInput.addEventListener('input', function() {
        clearTimeout(timeoutId);
        const query = this.value;
        if (query.length < 3) { suggestionList.style.display = 'none'; return; }

        timeoutId = setTimeout(() => {
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Việt Nam')}&limit=5`)
                .then(res => res.json()).then(data => {
                    suggestionList.innerHTML = '';
                    data.forEach(item => {
                        const li = document.createElement('li');
                        li.innerText = item.display_name;
                        li.onclick = function() {
                            const lat = parseFloat(item.lat), lon = parseFloat(item.lon);
                            map.setView([lat, lon], 17);
                            marker.setLatLng([lat, lon]);
                            updateCoords(lat, lon);
                            document.getElementById('dia_chi_input').value = item.display_name;
                            suggestionList.style.display = 'none';
                        };
                        suggestionList.appendChild(li);
                    });
                    suggestionList.style.display = 'block';
                });
        }, 400);
    });
</script>
{% endblock %}
