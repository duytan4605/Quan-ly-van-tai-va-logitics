{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div style="width: 100%; max-width: 400px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fa-solid fa-user-shield" style="font-size: 40px; color: #5e72e4; margin-bottom: 10px;"></i>
            <h2 style="color: #32325d; margin: 0;">Đăng Nhập Quản Trị</h2>
            <p style="color: #8898aa; font-size: 14px; margin-top: 5px;">Hệ thống Logistics Pro</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
                <div style="background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 13px; text-align: center;">
                    Tài khoản hoặc mật khẩu không chính xác!
                </div>
            {% endif %}

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; color: #525f7f; margin-bottom: 8px;">Tên đăng nhập</label>
                <input type="text" name="username" required style="width: 100%; padding: 12px; border: 1px solid #dee2e6; border-radius: 6px; outline: none; font-family: inherit;">
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-weight: 600; color: #525f7f; margin-bottom: 8px;">Mật khẩu</label>
                <input type="password" name="password" required style="width: 100%; padding: 12px; border: 1px solid #dee2e6; border-radius: 6px; outline: none; font-family: inherit;">
            </div>

            <button type="submit" style="width: 100%; background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(50,50,93,.11);">
                ĐĂNG NHẬP
            </button>
        </form>
    </div>
</div>
{% endblock %}
